defaults:
  - schema
  - _self_

wandb: false
wandb_run_name: ZINC DIAL k=4 GPS
wandb_project: ICML-2026

base_model: gps
gine_model_bn: false
pe_method: dial
n_node_types: 28
n_edge_types: 3
node_emb_dims: 128
pooling: add

gps_heads: 4
gps_dropout: 0.0
gps_attn_dropout: 0.0
gps_local_model: gine

sample_aggr_model_name: dial-gin
dial_diag_est_place: after_bn
pe_dims: 37
n_sample_aggr_layers: 8
sample_aggr_hidden_dims: 40

n_base_layers: 4
base_hidden_dims: 128

n_mlp_layers: 3
mlp_hidden_dims: 105
mlp_use_bn: true
mlp_use_ln: false
mlp_activation: relu
mlp_dropout_prob: 0.0
pe_aggregate: add

residual: true
graph_norm: false
batch_norm: true

use_subset: true
train_batch_size: 128
val_batch_size: 128

basis: false
num_samples: 120
pearl_k: 4
pearl_mlp_nlayers: 1
pearl_mlp_hid: 37
pearl_mlp_out: 37
pearl_act: relu

lr: 3e-3
weight_decay: 1e-5
momentum: 0.9
nesterov: false
n_warmup_steps: 10000
target_dim: 1
n_epochs: 2000
out_dirpath: out/zinc/dial_gps
