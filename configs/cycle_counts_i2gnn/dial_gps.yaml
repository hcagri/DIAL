defaults:
  - schema
  - _self_

wandb: false
wandb_run_name: I2GNN cycle counting DIAL k=4 GPS
wandb_project: ICML-2026

base_model: gps
gine_model_bn: false
pe_method: dial
n_node_types: 1
n_edge_types: 1
node_emb_dims: 64
pooling: none

gps_heads: 4
gps_dropout: 0.0
gps_attn_dropout: 0.0
gps_local_model: gin

sample_aggr_model_name: dial-gin
dial_diag_est_place: after_bn
pe_dims: 37
n_sample_aggr_layers: 6
sample_aggr_hidden_dims: 40

# Four downstream GPS layers; DIAL's six GIN layers are configured above.
n_base_layers: 4
base_hidden_dims: 64

basis: false
num_samples: 120
pearl_k: 4
pearl_mlp_nlayers: 1
pearl_mlp_hid: 37
pearl_mlp_out: 37
pearl_act: relu
target_dim: 1

n_mlp_layers: 2
mlp_hidden_dims: 64
mlp_use_bn: true
mlp_use_ln: false
mlp_activation: relu
mlp_dropout_prob: 0.0
pe_aggregate: add

residual: true
graph_norm: false
batch_norm: true

lr: 1e-3
weight_decay: 1e-4
n_warmup_steps: 10

n_epochs: 2000
out_dirpath: out/cycle_counts_i2gnn/dial_gps

use_subset: true
train_batch_size: 256
val_batch_size: 256
momentum: 0.9
nesterov: false
