defaults:
  - schema
  - _self_


# ============================================
# USED
# ============================================

# --- Logging ---
wandb: True
wandb_run_name: 16-Jan-2026 I2GNN-Cycle-Counts - dial k=4
wandb_project: ICML-2026

# --- Model Selection ---
base_model: gin_node_classifier
gine_model_bn: False
pe_method: dial
n_node_types: 1  
n_edge_types: 1
node_emb_dims: 64
pooling: None

n_base_layers: 5
base_hidden_dims: 64

sample_aggr_model_name: dial-gin
dial_diag_est_place: after_bn
pe_dims: 37   # based on SPE paper by Huang et al. (2023)
n_sample_aggr_layers: 6
sample_aggr_hidden_dims: 48

basis: false 
num_samples: 64
pearl_k: 4
pearl_mlp_nlayers: 1
pearl_mlp_hid: 37   
pearl_mlp_out: 37
pearl_act: relu

target_dim: 1

# MLPs on GIN models
n_mlp_layers: 3
mlp_hidden_dims: 64
mlp_use_bn: true
mlp_use_ln: false
mlp_activation: relu
mlp_dropout_prob: 0.0
pe_aggregate: add


# --- Architecture Flags ---
residual: true
graph_norm: false 
batch_norm: True  

# --- Optimizer ---
lr: 1e-3
weight_decay: 1e-4
n_warmup_steps: 10

# --- Training ---
n_epochs: 2000
out_dirpath: out/baseline


# ============================================
# NOT USED 
# ============================================

# --- Batching (unused - now using single graph) ---
use_subset: True
train_batch_size: 256
val_batch_size: 256

# --- Optimizer (unused) ---
momentum: 0.9
nesterov: false


