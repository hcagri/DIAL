# Dataset dimensions are inferred from the selected official split at runtime.
dataset_name: CIFAR10
num_workers: 4
seed: 0

wandb: false
wandb_run_name: superpixels-cifar10-rpearl-r32
wandb_project: LoG-rebuttal

base_model: gine
gine_model_bn: true
pe_method: pearl
n_node_types: 1
n_edge_types: 1
node_emb_dims: 64
pooling: mean

sample_aggr_model_name: gin
dial_diag_est_place: after_bn
pe_dims: 32
n_sample_aggr_layers: 4
sample_aggr_hidden_dims: 64

n_base_layers: 4
base_hidden_dims: 64

n_mlp_layers: 2
mlp_hidden_dims: 64
mlp_use_bn: true
mlp_use_ln: false
mlp_activation: relu
mlp_dropout_prob: 0.0
pe_aggregate: add

residual: true
graph_norm: false
batch_norm: true

use_subset: false
train_batch_size: 16
val_batch_size: 16

basis: false
num_samples: 32  # Initial probe count r; override as num_samples=64 if needed.
pearl_k: 4
pearl_mlp_nlayers: 1
pearl_mlp_hid: 32
pearl_mlp_out: 32
pearl_act: relu

lr: 1e-3
weight_decay: 1e-5
momentum: 0.9
nesterov: false
n_warmup_steps: 100

target_dim: 1
n_epochs: 100
out_dirpath: out/superpixels/rpearl
